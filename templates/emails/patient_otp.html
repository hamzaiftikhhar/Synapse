{% extends "emails/base.html" %}
{% block title %}Your verification code{% endblock %}
{% block content %}
<h1 style="margin:0 0 16px;font-size:20px;color:#0b0e2e;">Your verification code</h1>
<p style="margin:0 0 12px;">
  Use this code to verify yourself with <strong>{{ clinic_name }}</strong>:
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td style="border-radius:8px;background-color:#f4f4f7;padding:16px 28px;">
      <span style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:0.2em;color:#0b0e2e;">{{ code }}</span>
    </td>
  </tr>
</table>
<p style="margin:0;color:#6b7085;">
  It expires shortly. If you didn't request this, you can ignore this email.
</p>
{% endblock %}
