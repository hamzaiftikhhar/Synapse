<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Synapse{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
        <tr>
          <td style="background-color:#0b0e2e;padding:24px 32px;">
            <span style="color:#f5f3ff;font-size:18px;font-weight:600;letter-spacing:-0.01em;">Synapse</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;color:#1f2230;font-size:15px;line-height:1.6;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;border-top:1px solid #eceef2;color:#8a8fa3;font-size:12px;line-height:1.6;">
            Synapse — AI front desk for healthcare clinics.<br>
            Questions? Reply to this email or contact <a href="mailto:support@synapse.local" style="color:#5b21b6;">support@synapse.local</a>.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
